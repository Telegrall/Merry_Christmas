<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Новогодний отсчёт</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1e3a5f 0%, #0b1a2f 50%, #04080f 100%);
    color: #eaf4ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 14px;
    position: relative;
  }

  /* фоновые звёзды */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; transition: opacity .6s; }
  body.mode-summer .stars { opacity: 0; }
  .star-dot {
    position: absolute; background: #fff; border-radius: 50%;
    animation-name: star-twinkle; animation-timing-function: ease-in-out;
    animation-iteration-count: infinite; animation-direction: alternate;
  }
  @keyframes star-twinkle {
    from { opacity: .12; transform: scale(.8); }
    to   { opacity: 1;   transform: scale(1.25); }
  }

  /* ============ ЛЕТНЯЯ СЦЕНА ============ */
  .summer-scene {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0; visibility: hidden;
    transition: opacity .7s ease, visibility 0s .7s;
    background: linear-gradient(180deg,
      #87ceeb 0%, #b0e0e6 26%, #8fd3f0 42%,
      #4aa8d8 46%, #1e6091 55%, #16527d 64%,
      #f4d47c 66%, #e8b85a 78%, #d9a64a 100%);
    overflow: hidden;
  }
  body.mode-summer .summer-scene {
    opacity: 1; visibility: visible;
    transition: opacity .7s ease, visibility 0s 0s;
  }

  .sun {
    position: absolute; top: 6%; right: 7%;
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle, #fff9c4 0%, #ffe066 40%, #ffb703 72%, #ff8a00 100%);
    box-shadow: 0 0 60px 25px rgba(255, 200, 60, .45),
                0 0 120px 50px rgba(255, 170, 40, .2);
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50%      { transform: scale(1.06); filter: brightness(1.12); }
  }

  .cloud {
    position: absolute; height: 26px; border-radius: 999px;
    background: rgba(255, 255, 255, .85);
    filter: blur(.4px);
    box-shadow: 0 6px 14px rgba(0, 50, 100, .1);
  }
  .cloud::before, .cloud::after {
    content: ''; position: absolute; border-radius: 50%;
    background: rgba(255, 255, 255, .9);
  }
  .cloud::before { width: 40px; height: 40px; left: 15px; top: -18px; }
  .cloud::after  { width: 30px; height: 30px; left: 55px; top: -12px; }
  .cloud.c1 { width: 100px; top: 14%; left: 12%; animation: cloudDrift 50s linear infinite; }
  .cloud.c2 { width: 80px;  top: 22%; left: 60%; animation: cloudDrift 65s linear infinite -20s; opacity: .8; }
  .cloud.c3 { width: 120px; top: 8%;  left: 35%; animation: cloudDrift 80s linear infinite -40s; opacity: .7; }
  @keyframes cloudDrift {
    from { transform: translateX(-10vw); }
    to   { transform: translateX(110vw); }
  }

  .wave {
    position: absolute; left: 0; right: 0; height: 60px;
    background-repeat: repeat-x;
    background-size: 200px 60px;
    transition: animation-duration .6s ease;
  }
  .wave.w1 {
    top: 45%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 60'><path d='M0,30 Q50,0 100,30 T200,30 L200,60 L0,60 Z' fill='%234aa8d8'/></svg>");
    animation: waveSlide 6s linear infinite;
  }
  .wave.w2 {
    top: 48%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 60'><path d='M0,30 Q50,0 100,30 T200,30 L200,60 L0,60 Z' fill='%233d99c9'/></svg>");
    animation: waveSlide 9s linear infinite -3s;
    opacity: .85;
  }
  @keyframes waveSlide {
    from { background-position-x: 0; }
    to   { background-position-x: 200px; }
  }
  /* шторм: волны бегут быстрее */
  body.mode-summer.effect-on .wave.w1 { animation-duration: 2.2s; }
  body.mode-summer.effect-on .wave.w2 { animation-duration: 2.8s; }

  /* большая разовая волна */
  .big-wave {
    position: absolute; left: -10%; bottom: 0;
    width: 120%; height: 60vh;
    background: linear-gradient(180deg,
      rgba(120, 190, 240, 0) 0%,
      rgba(140, 205, 250, .5) 25%,
      rgba(90, 165, 220, .7) 60%,
      rgba(70, 145, 200, .85) 100%);
    border-radius: 50% 50% 0 0 / 20% 20% 0 0;
    pointer-events: none;
    transform: translateY(100%);
    animation: waveSweep 2s ease-out forwards;
  }
  @keyframes waveSweep {
    0%   { transform: translateY(100%); }
    40%  { transform: translateY(5%); }
    100% { transform: translateY(100%); }
  }

  .palm {
    position: absolute; font-size: 96px; line-height: 1;
    transform-origin: 50% 100%;
    filter: drop-shadow(4px 8px 10px rgba(0, 40, 80, .35));
    animation: palmSway 4.5s ease-in-out infinite;
  }
  .palm.p1 { bottom: 2vh; left: 2%; animation-delay: 0s; }
  .palm.p2 { bottom: 3vh; right: 2%; font-size: 80px; animation-delay: 1.6s; }
  .palm.p3 { bottom: 1vh; left: 44%; font-size: 56px; animation-delay: 2.8s; opacity: .75; }
  @keyframes palmSway {
    0%, 100% { transform: rotate(-2.5deg); }
    50%      { transform: rotate(2.5deg); }
  }

  .foam-layer { position: absolute; inset: 0; pointer-events: none; }

  .foam {
    position: absolute;
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255, 255, 255, .9);
    box-shadow: 0 0 8px rgba(255, 255, 255, .9);
    animation: foamRise 1.4s ease-out forwards;
    pointer-events: none;
  }
  @keyframes foamRise {
    0%   { transform: translate(0, 0) scale(.5); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(var(--dx, 20px), -20vh) scale(1.4); opacity: 0; }
  }

  /* слой снега и капель */
  .snow-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
  .flake {
    position: absolute; top: 0; left: 0; line-height: 1;
    color: #dceeff;
    font-family: 'Segoe UI Symbol', 'Arial Unicode MS', sans-serif;
    text-shadow: 0 0 8px rgba(160, 210, 255, .9);
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }
  @keyframes fall {
    0%   { transform: translate3d(0, -15vh, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { transform: translate3d(var(--drift, 0px), 112vh, 0) rotate(720deg); opacity: 0; }
  }
  .flake.drag { animation-name: fallFromPointer; }
  @keyframes fallFromPointer {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: .9; }
    100% { transform: translate3d(var(--drift, 0px), 110vh, 0) rotate(540deg); opacity: 0; }
  }

  /* капля-брызг (летний драг) */
  .drop {
    position: absolute;
    width: 7px; height: 10px;
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    background: linear-gradient(180deg, #e8f5ff 0%, #8fd3ff 40%, #4a9dd4 100%);
    box-shadow: 0 0 8px rgba(160, 220, 255, .9), inset 0 -2px 3px rgba(0, 0, 0, .2);
    animation: dropFall linear forwards;
    pointer-events: none;
    will-change: transform, opacity;
  }
  @keyframes dropFall {
    0%   { transform: translate3d(0, 0, 0) scale(.6); opacity: 0; }
    12%  { opacity: 1; transform: translate3d(0, 6px, 0) scale(1); }
    100% { transform: translate3d(var(--dx, 20px), 90vh, 0) scale(.7); opacity: 0; }
  }

  /* «бульк» — расходящееся кольцо */
  .splash-ring {
    position: absolute;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid rgba(180, 230, 255, .85);
    box-shadow: 0 0 10px rgba(140, 210, 255, .5);
    transform: translate(-50%, -50%) scale(0.3);
    pointer-events: none;
    animation: ringExpand .65s ease-out forwards;
  }
  @keyframes ringExpand {
    0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
  }

  /* контент */
  .content {
    position: relative; z-index: 2; width: 100%; max-width: 720px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  body.mode-summer .content { gap: 18px; }

  h1 {
    margin: 0;
    font-size: clamp(1.1rem, 4vw, 1.85rem);
    font-weight: 600; text-align: center; letter-spacing: .5px;
    background: linear-gradient(90deg, #8fd3ff, #ffffff, #8fd3ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(120, 200, 255, .45));
  }
  body.mode-summer h1 {
    background: linear-gradient(90deg, #fff, #fffbe0, #fff);
    filter: drop-shadow(0 2px 8px rgba(0, 60, 100, .55));
  }

  /* переключатель режимов */
  .mode-bar {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(160, 210, 255, .2);
    padding: 5px; border-radius: 999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  body.mode-summer .mode-bar {
    background: rgba(0, 50, 90, .35);
    border-color: rgba(255, 255, 255, .3);
  }
  .mode-btn {
    cursor: pointer; font-family: inherit; font-size: .85rem; font-weight: 600;
    color: #cfe6ff; background: transparent; border: none;
    padding: 8px 18px; border-radius: 999px;
    transition: background .25s, color .25s, transform .15s;
    white-space: nowrap;
  }
  .mode-btn:hover { background: rgba(140, 200, 255, .14); }
  body.mode-summer .mode-btn { color: #eaf6ff; }
  body.mode-summer .mode-btn:hover { background: rgba(255, 255, 255, .12); }
  .mode-btn.active {
    background: linear-gradient(135deg, #8fd3ff, #d7f0ff);
    color: #062033;
    box-shadow: 0 4px 16px rgba(110, 190, 255, .35);
  }
  body.mode-summer .mode-btn.active {
    background: linear-gradient(135deg, #ffe066, #fff9c4);
    color: #3a2400;
  }
  .mode-btn:active { transform: scale(.97); }

  /* отсчёт */
  .countdown { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .unit {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 84px; padding: 12px 14px; border-radius: 16px;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(160, 210, 255, .22);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .35), inset 0 0 20px rgba(120, 190, 255, .06);
  }
  body.mode-summer .unit {
    background: rgba(0, 50, 90, .4);
    border-color: rgba(255, 255, 255, .25);
  }
  .num {
    font-size: 1.9rem; font-weight: 700; line-height: 1.1;
    font-variant-numeric: tabular-nums; color: #fff;
    text-shadow: 0 0 16px rgba(140, 210, 255, .7);
  }
  body.mode-summer .num { text-shadow: 0 2px 6px rgba(0, 30, 60, .6); }
  .label {
    margin-top: 4px; font-size: .7rem; letter-spacing: .12em;
    text-transform: uppercase; color: #9dc2e6;
  }
  body.mode-summer .label { color: #d4ecff; }
  .unit.seconds .num { color: #ffe680; text-shadow: 0 0 18px rgba(255, 220, 90, .8); }
  body.mode-summer .unit.seconds .num { text-shadow: 0 2px 8px rgba(255, 180, 0, .7); }
  .unit.seconds.tick .num { animation: tick .4s ease; }
  @keyframes tick {
    0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); }
  }

  /* ёлка */
  .tree-wrap { position: relative; width: 300px; height: 450px; }
  body.mode-summer .tree-wrap { display: none; }
  .tree-wrap::before {
    content: ""; position: absolute; left: 50%; top: 55%;
    width: 360px; height: 360px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(70, 220, 140, .22), transparent 65%);
    filter: blur(10px); pointer-events: none;
  }
  .tree {
    position: absolute; inset: 0; transform-origin: 50% 100%;
    animation: sway 6s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-.6deg); } 50% { transform: rotate(.6deg); }
  }
  .tier {
    position: absolute; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, #35b26b 0%, #1f8a4d 55%, #136b39 100%);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .35)); z-index: 1;
  }
  .t1 { width: 130px; height: 120px; top: 40px; }
  .t2 { width: 195px; height: 145px; top: 130px; }
  .t3 { width: 260px; height: 165px; top: 240px; }
  .trunk {
    position: absolute; left: 50%; top: 398px; width: 36px; height: 46px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #4a2c14, #8a5a2b 45%, #a9713a 55%, #4a2c14);
    border-radius: 3px 3px 2px 2px; z-index: 0;
  }
  .star {
    position: absolute; left: 50%; top: 0; font-size: 46px; line-height: 1;
    color: #ffe066;
    text-shadow: 0 0 14px #ffd000, 0 0 34px #ff9d00, 0 0 60px rgba(255, 180, 0, .6);
    z-index: 5; animation: star-pulse 2s ease-in-out infinite;
  }
  @keyframes star-pulse {
    0%, 100% { transform: translateX(-50%) scale(1) rotate(-4deg); filter: brightness(1); }
    50%      { transform: translateX(-50%) scale(1.12) rotate(4deg); filter: brightness(1.35); }
  }
  .ornament {
    position: absolute; width: 18px; height: 18px; border-radius: 50%;
    transform: translate(-50%, -50%); z-index: 2;
    box-shadow:
      0 0 14px 3px var(--glow, rgba(255, 200, 100, .85)),
      inset -4px -5px 8px rgba(0, 0, 0, .45),
      inset 3px 3px 7px rgba(255, 255, 255, .55);
    transition: background-color .35s ease, box-shadow .35s ease;
    animation: bauble-glow 2.4s ease-in-out infinite alternate;
  }
  @keyframes bauble-glow { from { filter: brightness(.82); } to { filter: brightness(1.18); } }
  .ornament.pop { animation: bauble-pop .5s ease, bauble-glow 2.4s ease-in-out infinite alternate; }
  @keyframes bauble-pop {
    0%   { transform: translate(-50%, -50%) scale(1); }
    45%  { transform: translate(-50%, -50%) scale(1.55); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  /* кнопка эффекта (снег / волна) */
  .snow-btn {
    cursor: pointer; font-family: inherit; font-size: 1rem; font-weight: 600;
    letter-spacing: .3px; color: #062033;
    padding: 13px 28px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #d7f0ff, #8fd3ff 55%, #b6e6ff);
    box-shadow: 0 10px 30px rgba(110, 190, 255, .35), inset 0 -3px 0 rgba(0, 0, 0, .12);
    transition: transform .15s ease, box-shadow .25s ease, background .3s ease, color .3s ease;
  }
  .snow-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(110, 190, 255, .5), inset 0 -3px 0 rgba(0, 0, 0, .12);
  }
  .snow-btn:active { transform: translateY(1px) scale(.98); }
  .snow-btn.active {
    color: #3a2400;
    background: linear-gradient(135deg, #ffe066, #ffb703 60%, #ffd166);
    box-shadow: 0 10px 34px rgba(255, 190, 60, .45), inset 0 -3px 0 rgba(0, 0, 0, .15);
  }
  /* морская тема для кнопки в летнем режиме */
  body.mode-summer .snow-btn {
    background: linear-gradient(135deg, #a8e0ff, #5cb3e8 55%, #8fd3ff);
    color: #062a44;
    box-shadow: 0 10px 30px rgba(90, 170, 230, .4), inset 0 -3px 0 rgba(0, 0, 0, .12);
  }
  body.mode-summer .snow-btn:hover {
    box-shadow: 0 14px 36px rgba(90, 170, 230, .55), inset 0 -3px 0 rgba(0, 0, 0, .12);
  }
  body.mode-summer .snow-btn.active {
    color: #eaf6ff;
    background: linear-gradient(135deg, #2c6f99, #1a4d6f 60%, #3a7fa3);
    box-shadow: 0 10px 34px rgba(70, 140, 200, .5), inset 0 -3px 0 rgba(0, 0, 0, .2);
  }

  /* адаптив */
  @media (max-width: 420px) {
    .countdown { gap: 6px; }
    .unit { min-width: 60px; padding: 8px 6px; border-radius: 12px; }
    .num { font-size: 1.35rem; }
    .label { font-size: .55rem; letter-spacing: .06em; }
    .content { gap: 13px; }
    .mode-btn { font-size: .74rem; padding: 6px 12px; }
    .palm.p1, .palm.p2 { font-size: 64px; }
    .palm.p3 { font-size: 40px; }
    .sun { width: 80px; height: 80px; }
  }
  @media (max-height: 880px) { .content { zoom: .92; } }
  @media (max-height: 800px) { .content { zoom: .84; } }
  @media (max-height: 720px) { .content { zoom: .74; } }
  @media (max-height: 640px) { .content { zoom: .64; } }
  @media (max-height: 560px) { .content { zoom: .54; } }
</style>
</head>
<body class="mode-newyear">

<div class="stars" id="stars"></div>

<div class="summer-scene" id="summerScene" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="wave w1"></div>
  <div class="wave w2"></div>
  <div class="palm p1">🌴</div>
  <div class="palm p2">🌴</div>
  <div class="palm p3">🌴</div>
  <div class="foam-layer" id="foamLayer"></div>
</div>

<div class="snow-layer" id="snow"></div>

<main class="content">
  <h1 id="title">До 31 декабря осталось</h1>

  <div class="mode-bar" id="modeBar">
    <button type="button" class="mode-btn active" data-mode="newyear">🎄 Новый год</button>
    <button type="button" class="mode-btn" data-mode="summer">☀️ До лета</button>
  </div>

  <div class="countdown">
    <div class="unit"><span class="num" id="days">00</span><span class="label">дней</span></div>
    <div class="unit"><span class="num" id="hours">00</span><span class="label">часов</span></div>
    <div class="unit"><span class="num" id="minutes">00</span><span class="label">минут</span></div>
    <div class="unit seconds" id="secondsUnit"><span class="num" id="seconds">00</span><span class="label">секунд</span></div>
  </div>

  <div class="tree-wrap">
    <div class="tree" id="tree">
      <div class="star">★</div>
      <div class="tier t1"></div>
      <div class="tier t2"></div>
      <div class="tier t3"></div>
      <div class="trunk"></div>
    </div>
  </div>

  <button class="snow-btn" id="snowBtn" type="button">❄ Пусть идёт снег</button>
</main>

<script>
(function () {
  'use strict';

  /* ================= COOKIE / LOCALSTORAGE ================= */
  const COOKIE_MODE = 'ny_mode';
  const COOKIE_FX   = 'ny_snow'; // универсальный ключ: '1' — эффект включён

  function saveSetting(name, value) {
    try {
      const d = new Date();
      d.setTime(d.getTime() + 365 * 864e5);
      document.cookie = name + '=' + encodeURIComponent(value) +
        ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
    } catch (e) {}
    try { localStorage.setItem(name, value); } catch (e) {}
  }
  function readSetting(name) {
    const m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
    if (m) return decodeURIComponent(m[1]);
    try { return localStorage.getItem(name); } catch (e) { return null; }
  }

  /* ================= ФОНОВЫЕ ЗВЁЗДЫ ================= */
  const starsLayer = document.getElementById('stars');
  const sf = document.createDocumentFragment();
  for (let i = 0; i < 90; i++) {
    const dot = document.createElement('i');
    const size = (Math.random() * 2 + 0.7).toFixed(2);
    dot.className = 'star-dot';
    dot.style.cssText =
      'width:' + size + 'px;height:' + size + 'px;' +
      'left:' + (Math.random() * 100).toFixed(2) + '%;' +
      'top:' + (Math.random() * 100).toFixed(2) + '%;' +
      'animation-duration:' + (2 + Math.random() * 4).toFixed(2) + 's;' +
      'animation-delay:' + (-Math.random() * 6).toFixed(2) + 's;';
    sf.appendChild(dot);
  }
  starsLayer.appendChild(sf);

  /* ================= ДАТЫ И РЕЖИМЫ ================= */
  const titleEl = document.getElementById('title');
  const modeBar = document.getElementById('modeBar');
  const modeButtons = Array.prototype.slice.call(modeBar.querySelectorAll('.mode-btn'));

  let mode = 'newyear';
  let targetDate = getNewYearTarget();
  let effectOn = false;

  function getNewYearTarget() {
    const now = new Date();
    const y = now.getFullYear();
    let t = new Date(y, 11, 31, 0, 0, 0, 0);
    if (now >= t) t = new Date(y + 1, 11, 31, 0, 0, 0, 0);
    return t;
  }
  function getSummerTarget() {
    const now = new Date();
    const y = now.getFullYear();
    let t = new Date(y, 5, 1, 0, 0, 0, 0);
    if (now >= t) t = new Date(y + 1, 5, 1, 0, 0, 0, 0);
    return t;
  }
  function refreshTarget() {
    targetDate = mode === 'summer' ? getSummerTarget() : getNewYearTarget();
  }

  function updateTitle() {
    titleEl.textContent = mode === 'summer'
      ? 'До лета осталось'
      : 'До 31 декабря осталось';
  }

  function updateEffectButton() {
    const isSummer = mode === 'summer';
    if (isSummer) {
      snowBtn.textContent = effectOn ? '🌊 Успокоить море' : '🌊 Волна';
    } else {
      snowBtn.textContent = effectOn ? '❄ Остановить снегопад' : '❄ Пусть идёт снег';
    }
    snowBtn.classList.toggle('active', effectOn);
  }

  function applyMode() {
    document.body.classList.remove('mode-newyear', 'mode-summer');
    document.body.classList.add('mode-' + mode);
    modeButtons.forEach(function (b) {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    refreshTarget();
    updateTitle();
    updateEffectButton();
    updateCountdown();
  }

  function setMode(newMode) {
    if (newMode === mode) return;
    if (effectOn) setEffect(false);
    mode = newMode;
    applyMode();
    saveSetting(COOKIE_MODE, mode);
  }

  modeButtons.forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.mode); });
  });

  /* ================= ОТСЧЁТ ================= */
  const el = {
    days: document.getElementById('days'),
    hours: document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds'),
    secondsUnit: document.getElementById('secondsUnit')
  };
  const pad = n => String(n).padStart(2, '0');

  function updateCountdown() {
    const now = new Date();
    if (now >= targetDate) refreshTarget();
    const diff = Math.max(0, targetDate - now);
    el.days.textContent    = pad(Math.floor(diff / 86400000));
    el.hours.textContent   = pad(Math.floor((diff % 86400000) / 3600000));
    el.minutes.textContent = pad(Math.floor((diff % 3600000) / 60000));
    el.seconds.textContent = pad(Math.floor((diff % 60000) / 1000));
    el.secondsUnit.classList.remove('tick');
    void el.secondsUnit.offsetWidth;
    el.secondsUnit.classList.add('tick');
  }

  /* ================= ШАРИКИ ================= */
  const COLORS = [
    { c: '#ff4d4d', g: 'rgba(255, 77, 77, .85)' },
    { c: '#ffd93b', g: 'rgba(255, 217, 59, .85)' },
    { c: '#4dd2ff', g: 'rgba(77, 210, 255, .85)' },
    { c: '#c06bff', g: 'rgba(192, 107, 255, .85)' },
    { c: '#4dff9e', g: 'rgba(77, 255, 158, .85)' },
    { c: '#ff8a3b', g: 'rgba(255, 138, 59, .85)' },
    { c: '#ff6bd6', g: 'rgba(255, 107, 214, .85)' }
  ];
  const POSITIONS = [
    [150, 78], [132, 112], [172, 120],
    [140, 168], [112, 208], [188, 202], [92, 248], [150, 252], [208, 242],
    [134, 286], [172, 280], [103, 326], [150, 318], [197, 322],
    [76, 368], [122, 360], [170, 366], [224, 358]
  ];
  const tree = document.getElementById('tree');
  const ornaments = [];
  POSITIONS.forEach(function (pos) {
    const b = document.createElement('div');
    b.className = 'ornament';
    b.style.left = pos[0] + 'px';
    b.style.top  = pos[1] + 'px';
    const col = COLORS[Math.floor(Math.random() * COLORS.length)];
    b.style.backgroundColor = col.c;
    b.style.setProperty('--glow', col.g);
    b.dataset.color = COLORS.indexOf(col);
    tree.appendChild(b);
    ornaments.push(b);
  });

  let lastOrn = -1;
  function randomizeOrnament() {
    if (!ornaments.length) return;
    let i;
    do { i = Math.floor(Math.random() * ornaments.length); }
    while (i === lastOrn && ornaments.length > 1);
    lastOrn = i;
    const b = ornaments[i];
    let ci;
    do { ci = Math.floor(Math.random() * COLORS.length); }
    while (ci === Number(b.dataset.color) && COLORS.length > 1);
    const col = COLORS[ci];
    b.dataset.color = ci;
    b.style.backgroundColor = col.c;
    b.style.setProperty('--glow', col.g);
    b.classList.remove('pop');
    void b.offsetWidth;
    b.classList.add('pop');
    setTimeout(() => b.classList.remove('pop'), 520);
  }

  /* ================= ЧАСТИЦЫ ================= */
  const snowLayer = document.getElementById('snow');
  const foamLayer = document.getElementById('foamLayer');
  const summerScene = document.getElementById('summerScene');
  const SYMBOLS = ['❄', '❅', '❆', '✻', '✽'];
  const MAX_PARTICLES = 500;
  const pickSymbol = () => SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];

  /* --- снежинки (зима) --- */
  function createFlake(prefilled) {
    if (snowLayer.children.length > MAX_PARTICLES) return;
    const f = document.createElement('span');
    f.className = 'flake';
    f.textContent = pickSymbol();
    f.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    f.style.fontSize = (10 + Math.random() * 18).toFixed(1) + 'px';
    f.style.setProperty('--drift', (Math.random() * 200 - 100).toFixed(0) + 'px');
    const dur = 4.5 + Math.random() * 5;
    f.style.animationDuration = dur.toFixed(2) + 's';
    let life = dur;
    if (prefilled) {
      const d = -Math.random() * dur;
      f.style.animationDelay = d.toFixed(2) + 's';
      life = dur + d;
    }
    snowLayer.appendChild(f);
    setTimeout(() => f.remove(), life * 1000 + 300);
  }

  /* --- капля-брызг (лето) --- */
  function spawnDrop(x, y) {
    if (snowLayer.children.length > MAX_PARTICLES) return;
    const d = document.createElement('span');
    d.className = 'drop';
    d.style.left = x + 'px';
    d.style.top  = y + 'px';
    d.style.setProperty('--dx', (Math.random() * 120 - 60).toFixed(0) + 'px');
    const dur = 1.2 + Math.random() * 1.4;
    d.style.animationDuration = dur.toFixed(2) + 's';
    snowLayer.appendChild(d);
    setTimeout(() => d.remove(), dur * 1000 + 200);
  }

  /* --- кольцо-бульк --- */
  function spawnRing(x, y) {
    const r = document.createElement('span');
    r.className = 'splash-ring';
    r.style.left = x + 'px';
    r.style.top  = y + 'px';
    snowLayer.appendChild(r);
    setTimeout(() => r.remove(), 700);
  }

  /* --- пена (шторм) --- */
  function spawnFoam() {
    if (!foamLayer || foamLayer.children.length > MAX_PARTICLES) return;
    const f = document.createElement('span');
    f.className = 'foam';
    f.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    f.style.top  = (44 + Math.random() * 7).toFixed(2) + 'vh';
    f.style.setProperty('--dx', (Math.random() * 80 - 40).toFixed(0) + 'px');
    const dur = 1.2 + Math.random() * 1.2;
    f.style.animationDuration = dur.toFixed(2) + 's';
    foamLayer.appendChild(f);
    setTimeout(() => f.remove(), dur * 1000 + 150);
  }

  /* --- большая волна --- */
  function spawnBigWave() {
    const w = document.createElement('div');
    w.className = 'big-wave';
    summerScene.appendChild(w);
    setTimeout(() => w.remove(), 2100);
  }

  /* ================= УПРАВЛЕНИЕ ЭФФЕКТОМ ================= */
  const snowBtn = document.getElementById('snowBtn');
  let snowTimer = null;
  let foamTimer = null;

  function startSnow() {
    for (let i = 0; i < 40; i++) setTimeout(() => createFlake(true), Math.random() * 600);
    snowTimer = setInterval(() => createFlake(false), 180);
  }
  function stopSnow() {
    clearInterval(snowTimer); snowTimer = null;
  }
  function startStorm() {
    spawnBigWave();
    if (!foamTimer) {
      foamTimer = setInterval(function () {
        for (let i = 0; i < 2; i++) spawnFoam();
      }, 120);
    }
  }
  function stopStorm() {
    clearInterval(foamTimer); foamTimer = null;
  }

  function setEffect(on, persist) {
    effectOn = on;
    document.body.classList.toggle('effect-on', on);
    updateEffectButton();
    stopSnow(); stopStorm();
    if (on) {
      if (mode === 'newyear') startSnow();
      else if (mode === 'summer') startStorm();
    }
    if (persist !== false) saveSetting(COOKIE_FX, on ? '1' : '0');
  }

  snowBtn.addEventListener('click', function () { setEffect(!effectOn, true); });

  /* ================= СНЕГ/КАПЛИ ОТ ПАЛЬЦА ================= */
  let pointerActive = false;
  let pointerX = 0, pointerY = 0;
  let dragTimer = null;

  function spawnDrag(x, y) {
    if (mode === 'summer') spawnDrop(x, y);
    else {
      if (snowLayer.children.length > MAX_PARTICLES) return;
      const f = document.createElement('span');
      f.className = 'flake drag';
      f.textContent = pickSymbol();
      f.style.left = x + 'px';
      f.style.top  = y + 'px';
      f.style.fontSize = (10 + Math.random() * 16).toFixed(1) + 'px';
      f.style.setProperty('--drift', (Math.random() * 180 - 90).toFixed(0) + 'px');
      const dur = 2.2 + Math.random() * 2.6;
      f.style.animationDuration = dur.toFixed(2) + 's';
      snowLayer.appendChild(f);
      setTimeout(() => f.remove(), dur * 1000 + 200);
    }
  }

  function burstAt(x, y, count, spread) {
    for (let i = 0; i < count; i++) {
      spawnDrag(
        x + (Math.random() * spread - spread / 2),
        y + (Math.random() * spread - spread / 2)
      );
    }
  }

  function startDrag(x, y) {
    pointerActive = true;
    pointerX = x; pointerY = y;
    if (mode === 'summer') {
      spawnRing(x, y);
      burstAt(x, y, 8, 70);
      if (Math.random() < .6) setTimeout(() => spawnRing(x, y), 120);
    } else {
      burstAt(x, y, 10, 70);
    }
    if (!dragTimer) {
      dragTimer = setInterval(function () {
        if (!pointerActive) return;
        burstAt(pointerX, pointerY, 3, 90);
      }, 45);
    }
  }

  function stopDrag() {
    pointerActive = false;
    if (dragTimer) { clearInterval(dragTimer); dragTimer = null; }
  }

  function isUI(target) {
    return !!(target && target.closest &&
      target.closest('button, input, label, .mode-bar'));
  }

  function onPointerDown(e) {
    if (isUI(e.target)) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    startDrag(e.clientX, e.clientY);
  }
  function onPointerMove(e) {
    if (!pointerActive) return;
    pointerX = e.clientX; pointerY = e.clientY;
    burstAt(pointerX, pointerY, 3, 60);
  }
  function onPointerUp() { stopDrag(); }

  window.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  if (!window.PointerEvent) {
    window.addEventListener('mousedown', function (e) {
      if (isUI(e.target)) return;
      startDrag(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', function (e) {
      if (!pointerActive) return;
      pointerX = e.clientX; pointerY = e.clientY;
      burstAt(pointerX, pointerY, 3, 60);
    });
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchstart', function (e) {
      if (isUI(e.target)) return;
      const t = e.touches[0];
      startDrag(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      if (!pointerActive) return;
      const t = e.touches[0];
      pointerX = t.clientX; pointerY = t.clientY;
      burstAt(pointerX, pointerY, 3, 60);
    }, { passive: true });
    window.addEventListener('touchend', onPointerUp);
    window.addEventListener('touchcancel', onPointerUp);
  }

  /* ================= ГЛАВНЫЙ ЦИКЛ ================= */
  function tick() { updateCountdown(); randomizeOrnament(); }
  function loop() { tick(); setTimeout(loop, 1000 - (Date.now() % 1000)); }

  /* ================= ИНИЦИАЛИЗАЦИЯ ================= */
  (function init() {
    const savedMode = readSetting(COOKIE_MODE);
    mode = savedMode === 'summer' ? 'summer' : 'newyear';
    applyMode();
    loop();
    if (readSetting(COOKIE_FX) === '1') setEffect(true, false);
  })();
})();
</script>
</body>
</html>
